apiVersion: apps/v1
kind: Deployment
metadata:
  name: complaintbox
  namespace: complaintbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: complaintbox
  template:
    metadata:
      labels:
        app: complaintbox
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting for mysql; sleep 3; done"]
      containers:
        - name: complaintbox
          image: REGISTRY/complaintbox:IMAGE_TAG   # replaced by your Jenkins sed step
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: complaintbox-secret, key: django-secret-key}
            - name: DJANGO_DEBUG
              value: "False"
            - name: DJANGO_ALLOWED_HOSTS
              value: "*"
            - name: DB_HOST
              value: mysql
            - name: DB_NAME
              value: complaintbox
            - name: DB_USER
              value: complaintbox
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: complaintbox-secret, key: db-password}
          volumeMounts:
            - name: media
              mountPath: /app/media
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: media
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: complaintbox
  namespace: complaintbox
spec:
  type: NodePort
  selector:
    app: complaintbox
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080