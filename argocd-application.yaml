apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: complaintbox
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/VishnuMadhu13/complaintbox   # change to your repo
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: complaintbox
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true